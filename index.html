<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Triada — Costeo de producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3EFE4;
    --surface: #FFFFFF;
    --border: #E4DCC8;
    --border-soft: #EFE9DA;
    --ink: #241F1A;
    --ink-soft: #6B6255;
    --ink-faint: #8A8478;
    --input-bg: #FFFDF9;
    --input-border: #D8D0BE;
    --accent: #9C7A3F;
    --accent-bg: #F7EFDD;
    --accent-border: #D9C299;
    --danger: #9C7A3F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  h1, h2, .serif { font-family: 'Playfair Display', serif; }
  header {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 1.5rem; }
  header .wrap { padding: 2rem 1.5rem 1.25rem; }
  header img { height: 108px; display: block; }
  header p { margin: 10px 0 0 2px; color: var(--ink-soft); font-size: 14.5px; }
  nav {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  nav .wrap { display: flex; gap: 4px; padding: 0 1.5rem; }
  nav button {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; font-size: 14px; font-weight: 500;
    background: transparent; border: none; cursor: pointer;
    color: var(--ink-soft); border-bottom: 2px solid transparent;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 920px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
  .banner {
    display: flex; gap: 8px; align-items: center;
    background: #FBEAE3; border: 1px solid var(--accent-border); color: #6E5528;
    font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 18px; overflow: hidden;
  }
  .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .card-head h2 { font-weight: 500; font-size: 16px; margin: 0; color: #3A332B; }
  .card-body { padding: 16px; }
  .card-body.compact { padding: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  input, select {
    border: 1px solid var(--input-border); border-radius: 6px; padding: 8px 10px;
    font-size: 13.5px; font-family: 'IBM Plex Sans', sans-serif;
    background: var(--input-bg); color: var(--ink); width: 100%;
  }
  .btn {
    border-radius: 6px; padding: 8px 12px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-family: inherit; font-size: 13.5px;
  }
  .btn-primary { background: var(--accent); color: #FFF; border: none; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--input-border); }
  .icon-btn {
    border: none; background: transparent; cursor: pointer; color: var(--ink-soft);
    padding: 4px; border-radius: 4px; display: inline-flex;
  }
  .icon-btn.danger { color: var(--accent); }
  .icon-btn:disabled { color: #C9C3B5; cursor: not-allowed; }
  .error-text { color: var(--accent); font-size: 13px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--ink-faint); padding: 10px 16px; border-bottom: 1px solid var(--border-soft); }
  th.right, td.right { text-align: right; }
  td { font-size: 13.5px; padding: 10px 16px; border-bottom: 1px solid #F4F0E5; }
  td.strong { font-weight: 600; }
  .empty { padding: 32px 16px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }
  .empty.small { padding: 16px 4px; }
  .cat-row { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .cat-label { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .metrics.three { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .metric { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .metric.accent { background: var(--accent-bg); border-color: var(--accent-border); }
  .metric .label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .metric .value { font-size: 19px; font-weight: 600; font-family: 'Playfair Display', serif; }
  .metric.accent .value { color: var(--accent); }
  .metric .sub { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .recetas-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  .recetas-list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .recetas-list-head span { font-size: 12.5px; font-weight: 500; color: var(--ink-soft); }
  .recetas-list { display: flex; flex-direction: column; gap: 4px; }
  .recetas-list button {
    text-align: left; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 13.5px; font-family: inherit; color: var(--ink);
  }
  .recetas-list button.active { border-color: var(--accent); background: var(--accent-bg); }
  .recipe-title-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .recipe-title-row input.title {
    font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 500; flex: 1;
    border: none; background: transparent; padding: 4px 0;
  }
  .recipe-meta { display: flex; gap: 20px; margin-bottom: 18px; }
  form.grid-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; align-items: end; margin-bottom: 10px; }
  form.grid-row2 { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  form.grid-line { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 12px; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .loading { padding: 3rem 1rem; text-align: center; color: var(--ink-soft); }
</style>
</head>

const UNITS_BY_GROUP = { masa: ['g','kg'], volumen: ['ml','l'], unidad: ['unidad'] };

const CATEGORY_COLORS = {
  'Proteína': '#9C7A3F', 'Panes': '#C89B3C', 'Vegetales': '#5C6B4F',
  'Salsas y aderezos': '#A8461F', 'Sales y condimentos': '#7C6F52', 'Quesos': '#B08B3F', 'Empaque': '#6B6255', 'Otros': '#8A8478',
};

const state = { insumos: [], recetas: [], recetaItems: [], laborRate: Number(localStorage.getItem('triada-labor-rate')) || 15000, selectedRecetaId: null, tab: 'insumos' };

const COP = (n) => isFinite(n) ? new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 }).format(Math.round(n)) : '$0';
const COP2 = (n) => isFinite(n) ? new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:2 }).format(n) : '$0';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function gvizFetch(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!match) throw new Error('El Sheet no es público o cambió de estructura (' + sheetName + ')');
  const json = JSON.parse(match[1]);
  const cols = json.table.cols.map(c => (c.label || '').trim());
  return (json.table.rows || []).map(row => {
    const obj = {};
    cols.forEach((label, i) => {
      if (!label) return;
      const cell = row.c[i];
      obj[label] = cell && cell.v !== null && cell.v !== undefined ? cell.v : '';
    });
    return obj;
  }).filter(obj => Object.values(obj).some(v => v !== ''));
}

async function apiPost(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Error al guardar');
  return data;
}

function showBanner(msg) {
  document.getElementById('banner-slot').innerHTML =

}
function clearBanner() { document.getElementById('banner-slot').innerHTML = ''; }

async function loadAll() {
  try {
    const [insumos, recetas, recetaItems] = await Promise.all([
      gvizFetch('INSUMOS'), gvizFetch('RECETAS'), gvizFetch('RECETAITEMS'),
    ]);
    state.insumos = insumos.map(normalizeInsumo);
    state.recetas = recetas.map(normalizeReceta);
    state.recetaItems = recetaItems.map(normalizeItem);
    if (!state.selectedRecetaId && state.recetas.length) state.selectedRecetaId = state.recetas[0].id;
    document.getElementById('loading').style.display = 'none';
    ['insumos','recetas','resumen'].forEach(t => document.getElementById('tab-'+t).style.display = t === state.tab ? 'block' : 'none');
    render();
  } catch (e) {
    document.getElementById('loading').textContent = 'No se pudo conectar con el Sheet. Revisa que esté compartido como "Cualquiera con el enlace" y vuelve a intentar.';
  }
}

function normalizeInsumo(r) {
  return { id: String(r.ID), name: r.NOMBRE || '', category: r.CATEGORIA || 'Otros', provider: r.PROVEEDOR || '', qty: Number(r.CANTIDAD) || 0, unit: r.UNIDAD || 'g', price: Number(r.PRECIO) || 0 };
}
function normalizeReceta(r) {
  return { id: String(r.ID), name: r.NOMBRE || '', servings: Number(r.PORCIONES) || 1, laborMinutes: Number(r.MINUTOS) || 0, yieldGrams: Number(r.RENDIMIENTO) || 0, steps: r.PASOS || '' };
}
function normalizeItem(r) {
  return { id: String(r.ID), recetaId: String(r.RECETAID), ingredientId: String(r.INGREDIENTEID), qty: Number(r.CANTIDAD) || 0, unit: r.UNIDAD || 'g' };
}

function unitCostOf(ing) {
  const info = UNIT_INFO[ing.unit];
  const baseQty = ing.qty * info.factor;
  if (!baseQty) return 0;
  return ing.price / baseQty;
}

// Converts a used quantity (in `unit`) into the ingredient's own base unit (g, ml or unidad).
// Mass and volume are treated as equivalent 1:1 (1 ml = 1 g) so you can buy in liters and
// use by weight, or vice versa. "unidad" only converts to "unidad".
function convertToBaseQty(ing, qty, unit) {
  const usedInfo = UNIT_INFO[unit];
  const ingGroup = UNIT_INFO[ing.unit].group;
  if (usedInfo.group === 'unidad' || ingGroup === 'unidad') {
    return usedInfo.group === ingGroup ? qty * usedInfo.factor : null;
  }
  return qty * usedInfo.factor;
}

async function onInsumoSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-category').value;
  const provider = document.getElementById('f-provider').value.trim();
  const qty = document.getElementById('f-qty').value;
  const unit = document.getElementById('f-unit').value;
  const price = document.getElementById('f-price').value;
  const errEl = document.getElementById('insumo-error');
  errEl.innerHTML = '';

  if (!name) return errEl.innerHTML = '<p class="error-text">Ponle un nombre al insumo.</p>';
  if (!qty || Number(qty) <= 0) return errEl.innerHTML = '<p class="error-text">La cantidad comprada debe ser mayor a 0.</p>';
  if (price === '' || Number(price) < 0) return errEl.innerHTML = '<p class="error-text">Ingresa el precio total pagado.</p>';

  try {
    if (insumoEditingId) {
      const payload = { ID: insumoEditingId, NOMBRE: name, CATEGORIA: category, PROVEEDOR: provider, CANTIDAD: Number(qty), UNIDAD: unit, PRECIO: Number(price) };
      await apiPost('updateInsumo', payload);
      const idx = state.insumos.findIndex(i => i.id === insumoEditingId);
      state.insumos[idx] = normalizeInsumo(payload);
      insumoEditingId = null;
    } else {
      const id = uid();
      const payload = { ID: id, NOMBRE: name, CATEGORIA: category, PROVEEDOR: provider, CANTIDAD: Number(qty), UNIDAD: unit, PRECIO: Number(price) };
      await apiPost('addInsumo', payload);
      state.insumos.push(normalizeInsumo(payload));
    }
    clearBanner();
    render();
  } catch (err) {
    showBanner('No se pudo guardar en el Sheet: ' + err.message);
  }
}

async function deleteInsumo(id) {
  try {
    await apiPost('deleteInsumo', { id });
    state.insumos = state.insumos.filter(i => i.id !== id);
    clearBanner();
    render();
  } catch (err) {
    showBanner('No se pudo eliminar: ' + err.message);
  }
}

async function createReceta() {
  const id = uid();

  try {
    await apiPost('addReceta', payload);
    state.recetas.push(normalizeReceta(payload));
    state.selectedRecetaId = id;
    clearBanner();
    renderRecetas();

let recetaSaveTimer = null;
function scheduleRecetaSave(receta) {
  clearTimeout(recetaSaveTimer);
  recetaSaveTimer = setTimeout(async () => {
    try {
      await apiPost('updateReceta', { ID: receta.id, NOMBRE: receta.name, PORCIONES: receta.servings, MINUTOS: receta.laborMinutes, RENDIMIENTO: receta.yieldGrams, PASOS: receta.steps });
      clearBanner();
    } catch (err) { showBanner('No se pudo guardar la receta: ' + err.message); }
  }, 500);
}

function renderRecipeEditor(recipe) {
  const host = document.getElementById('recipe-editor');
  const items = state.recetaItems.filter(it => it.recetaId === recipe.id);
  const cats = CATEGORIES.filter(c => state.insumos.some(i => (i.category||'Otros') === c));
  const lineUnits = (ingId) => {
    const ing = state.insumos.find(i => i.id === ingId);
    if (!ing) return ['g'];
    const group = UNIT_INFO[ing.unit].group;
    return group === 'unidad' ? ['unidad'] : ['g', 'kg', 'ml', 'l'];
  };

  const lineCost = (item) => {
    const ing = state.insumos.find(i => i.id === item.ingredientId);
    if (!ing) return 0;
    const baseQty = convertToBaseQty(ing, item.qty, item.unit);
    if (baseQty === null) return 0;
    return unitCostOf(ing) * baseQty;
  };
  const ingredientCost = items.reduce((s, it) => s + lineCost(it), 0);
  const laborCost = (recipe.laborMinutes / 60) * state.laborRate;
  const total = ingredientCost + laborCost;
  const servings = recipe.servings || 1;

  host.innerHTML = `
    <div class="recipe-title-row">
      <input class="title" id="r-name" value="${esc(recipe.name)}" />
      <button class="icon-btn danger" id="r-delete" title="Eliminar receta">🗑</button>

      <div class="field"><label>Tiempo invertido (minutos)</label><input id="r-minutes" type="number" min="0" step="any" value="${recipe.laborMinutes}" style="width:110px" /></div>
      <div class="field"><label>Porciones (opcional)</label><input id="r-servings" type="number" min="1" step="1" value="${recipe.servings}" style="width:90px" /></div>

      <div class="card-head"><h2 class="serif">Ingredientes de la receta</h2></div>
      <div class="card-body compact">
        <form id="line-form" class="grid-line">
          <div class="field"><label>Insumo</label>
            <select id="l-ingredient">
              ${cats.map(cat => `<optgroup label="${cat}">${state.insumos.filter(i => (i.category||'Otros')===cat).map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('')}</optgroup>`).join('')}
            </select>
          </div>
          <div class="field"><label>Cantidad usada</label><input id="l-qty" type="number" min="0" step="any" placeholder="20" /></div>
          <div class="field"><label>Unidad</label><select id="l-unit"></select></div>
          <button type="submit" class="btn btn-primary">+</button>
        </form>
        <div id="line-error"></div>
        ${items.length === 0 ? '<div class="empty small">Agrega los insumos que lleva esta receta y sus cantidades.</div>' : `
          <table><thead><tr><th>Insumo</th><th class="right">Cantidad usada</th><th class="right">Costo</th><th class="right"></th></tr></thead>
          <tbody>
            ${items.map(it => {
              const ing = state.insumos.find(i => i.id === it.ingredientId);
              return `<tr>
                <td>${ing ? esc(ing.name) : '(insumo eliminado)'}</td>
                <td class="right">${it.qty} ${UNIT_INFO[it.unit].label}</td>
                <td class="right">${COP(lineCost(it))}</td>
                <td class="right"><button class="icon-btn danger delete-line" data-id="${it.id}" title="Quitar">🗑</button></td>
              </tr>`;
            }).join('')}
          </tbody></table>
        `}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2 class="serif">Pasos de preparación</h2></div>
      <div class="card-body compact">
        <textarea id="r-steps" placeholder="1. Pica la cebolla...&#10;2. Mezcla con..." style="width:100%; min-height:110px; border:1px solid var(--input-border); border-radius:6px; padding:10px; font-family:inherit; font-size:13.5px; background:var(--input-bg); color:var(--ink); resize:vertical;">${esc(recipe.steps || '')}</textarea>

    <div class="metrics">

      <div class="metric"><div class="label">Costo mano de obra</div><div class="value">${COP(laborCost)}</div><div class="sub">${recipe.laborMinutes} min · ${COP(state.laborRate)}/h</div></div>
      <div class="metric accent"><div class="label">Costo total</div><div class="value">${COP(total)}</div></div>
      <div class="metric accent"><div class="label">Costo por gramo</div><div class="value">${recipe.yieldGrams > 0 ? COP2(total/recipe.yieldGrams) : '—'}</div>${recipe.yieldGrams > 0 ? '' : '<div class="sub">Ingresa el rendimiento en g</div>'}</div>
      <div class="metric"><div class="label">Costo por porción</div><div class="value">${COP(total/servings)}</div></div>

  const ingSelect = host.querySelector('#l-ingredient');

let metricsTimer = null;
function refreshMetricsSoon(recipe) {
  clearTimeout(metricsTimer);
  metricsTimer = setTimeout(() => renderRecipeEditor(recipe), 300);
}

async function addLine(recipe, ingredientId, qty, unit) {
  const errEl = document.getElementById('line-error');
  errEl.innerHTML = '';
  if (!ingredientId) return errEl.innerHTML = '<p class="error-text">Elige un insumo.</p>';
  if (!qty || Number(qty) <= 0) return errEl.innerHTML = '<p class="error-text">La cantidad usada debe ser mayor a 0.</p>';
  const ing = state.insumos.find(i => i.id === ingredientId);
  if (ing && convertToBaseQty(ing, Number(qty), unit) === null) {
    return errEl.innerHTML = `<p class="error-text">"${esc(ing.name)}" se compra por unidad — solo puedes usarlo en la receta en unidades, no en peso ni volumen.</p>`;
  }
  const id = uid();
  const payload = { ID: id, RECETAID: recipe.id, INGREDIENTEID: ingredientId, CANTIDAD: Number(qty), UNIDAD: unit };
  try {
    await apiPost('addRecetaItem', payload);
    state.recetaItems.push(normalizeItem(payload));
    clearBanner();
    renderRecipeEditor(recipe);
  } catch (err) { showBanner('No se pudo agregar el ingrediente: ' + err.message); }
}

async function deleteLine(id, recipe) {
  try {
    await apiPost('deleteRecetaItem', { id });
    state.recetaItems = state.recetaItems.filter(it => it.id !== id);
    clearBanner();
    renderRecipeEditor(recipe);
  } catch (err) { showBanner('No se pudo quitar el ingrediente: ' + err.message); }
}

async function deleteReceta(id) {
  try {
    await apiPost('deleteReceta', { id });
    state.recetas = state.recetas.filter(r => r.id !== id);
    state.recetaItems = state.recetaItems.filter(it => it.recetaId !== id);
    if (state.selectedRecetaId === id) state.selectedRecetaId = state.recetas[0]?.id || null;
    clearBanner();
    renderRecetas();
  } catch (err) { showBanner('No se pudo eliminar la receta: ' + err.message); }
}

/* ---------------- RESUMEN TAB ---------------- */

function renderResumen() {
  const el = document.getElementById('tab-resumen');
  const rows = state.recetas.map(r => {
    const items = state.recetaItems.filter(it => it.recetaId === r.id);
    const ingredientCost = items.reduce((s, it) => {
      const ing = state.insumos.find(i => i.id === it.ingredientId);
      if (!ing) return s;
      return s + unitCostOf(ing) * (convertToBaseQty(ing, it.qty, it.unit) || 0);
    }, 0);
    const laborCost = (r.laborMinutes / 60) * state.laborRate;
    const total = ingredientCost + laborCost;
    return { name: r.name, ingredientCost, laborCost, total, perServing: total / (r.servings || 1), perGram: r.yieldGrams > 0 ? total / r.yieldGrams : null };
  });
  const promedio = rows.length ? rows.reduce((s,r) => s + r.total, 0) / rows.length : 0;

  el.innerHTML = `
    <div class="card">
      <div class="card-head"><h2 class="serif">Tarifa de mano de obra</h2></div>
      <div class="card-body">
        <div class="field"><label>Valor por hora de trabajo</label><input id="labor-rate" type="number" min="0" step="any" value="${state.laborRate}" style="width:160px" /></div>
        <p style="font-size:13px;color:var(--ink-soft);margin-top:8px">Este valor se guarda en este navegador y se usa para calcular el costo del tiempo invertido en cada receta.</p>
      </div>
    </div>

    <div class="metrics three" style="margin: 18px 0">
      <div class="metric"><div class="label">Insumos registrados</div><div class="value">${state.insumos.length}</div></div>
      <div class="metric"><div class="label">Recetas costeadas</div><div class="value">${state.recetas.length}</div></div>
      <div class="metric accent"><div class="label">Costo promedio por receta</div><div class="value">${COP(promedio)}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2 class="serif">Costo por receta</h2></div>
      ${rows.length === 0 ? '<div class="empty">Crea recetas en la pestaña Recetas para verlas aquí.</div>' : `
        <table>
          <thead><tr><th>Receta</th><th class="right">Ingredientes</th><th class="right">Mano de obra</th><th class="right">Total</th><th class="right">Por gramo</th><th class="right">Por porción</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td>${esc(r.name)}</td>
            <td class="right">${COP(r.ingredientCost)}</td>
            <td class="right">${COP(r.laborCost)}</td>
            <td class="right strong">${COP(r.total)}</td>
            <td class="right">${r.perGram !== null ? COP2(r.perGram) : '—'}</td>
            <td class="right">${COP(r.perServing)}</td>
          </tr>`).join('')}</tbody>
        </table>
      `}
    </div>
  `;

  el.querySelector('#labor-rate').addEventListener('input', (e) => {
    state.laborRate = Number(e.target.value) || 0;
    localStorage.setItem('triada-labor-rate', state.laborRate);
    renderResumen();
  });
}

loadAll();
</script>
</body>
</html>
